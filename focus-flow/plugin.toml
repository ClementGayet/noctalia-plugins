id = "clementgayet/focus-flow"
name = "Focus Flow"
description = "Pomodoro focus timer, task list, and daily productivity overview."
version = "1.0.0"
plugin_api = 42
author = "clementgayet"
icon = "clock"
tags = ["productivity", "pomodoro", "tasks"]

[[setting]]
key = "focus_minutes"
type = "int"
label_key = "settings.focus_minutes.label"
description_key = "settings.focus_minutes.description"
default = 25
min = 1
max = 180

[[setting]]
key = "short_break_minutes"
type = "int"
label_key = "settings.short_break_minutes.label"
description_key = "settings.short_break_minutes.description"
default = 5
min = 1
max = 60

[[setting]]
key = "long_break_minutes"
type = "int"
label_key = "settings.long_break_minutes.label"
description_key = "settings.long_break_minutes.description"
default = 15
min = 1
max = 90

[[setting]]
key = "sessions_until_long_break"
type = "int"
label_key = "settings.sessions_until_long_break.label"
description_key = "settings.sessions_until_long_break.description"
default = 4
min = 2
max = 12

[[widget]]
id = "timer"
entry = "widget.luau"

[widget.actions]
left = "panel-toggle clementgayet/focus-flow:panel"
right = "panel-toggle clementgayet/focus-flow:panel"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 390
height = "content"
max_height = 620
placement = "attached"
open_near_click = true

[[service]]
id = "scheduler"
entry = "service.luau"
